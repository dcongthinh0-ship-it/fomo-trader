[project]
name = "fomo-trader"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "aiohttp==3.14.3",
  "PyYAML==6.0.3",
  "eth-account==0.13.7",
  "eth-abi==5.2.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "ASYNC"]
